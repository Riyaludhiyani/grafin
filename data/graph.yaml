# RELATIONSHIPS (EDGES)
# ----------------------------------------------------------------
edges:
  # Macro Transmission Channels: Crude Oil
  - source: "macro_brent_crude"
    target: "sector_paints"
    sign: "negative"
    weight: 0.85
    lag_days: 10
    confidence: "high"
    provenance: "curated_prior"
    rationale: "Crude oil derivatives such as titanium dioxide solvents, mineral turpentine, and phthalic anhydride comprise ~35-40% of paint input cost. Rising crude drives gross margin contraction."
    evidence_refs:
      - "Asian Paints Annual Report FY2023-24 (Raw Material Cost Disclosures)"
      - "Crisil Sector Research: Indian Decorative Paints Outlook"

  - source: "macro_brent_crude"
    target: "sector_aviation"
    sign: "negative"
    weight: 0.90
    lag_days: 5
    confidence: "high"
    provenance: "curated_prior"
    rationale: "Aviation Turbine Fuel (ATF) constitutes 35% to 45% of total operating expenses for Indian carriers. Unhedged crude price spikes directly squeeze airline EBITDAR."
    evidence_refs:
      - "DGCA Monthly Airline Financial Performance Bulletins"
      - "InterGlobe Aviation FY24 Management Discussion & Analysis"

  - source: "macro_brent_crude"
    target: "currency_usdinr"
    sign: "positive"
    weight: 0.75
    lag_days: 3
    confidence: "high"
    provenance: "curated_prior"
    rationale: "India imports over 85% of crude oil needs. Surging crude inflates the oil import bill, widens the Current Account Deficit, and triggers rupee depreciation pressures against the USD."
    evidence_refs:
      - "RBI Bulletin: External Sector Dynamics and Petroleum Import Elasticity"
      - "Ministry of Petroleum & Natural Gas (PPAC) Import Reports"

  - source: "macro_brent_crude"
    target: "macro_india_cpi"
    sign: "positive"
    weight: 0.70
    lag_days: 20
    confidence: "medium"
    provenance: "curated_prior"
    rationale: "Higher international crude prices pass through directly to transport fuel tariffs and downstream logistics, lifting headline wholesale and consumer price inflation."
    evidence_refs:
      - "RBI Working Paper Series: Fuel Price Pass-through into CPI in India"

  - source: "macro_brent_crude"
    target: "sector_energy"
    sign: "positive"
    weight: 0.65
    lag_days: 2
    confidence: "medium"
    provenance: "curated_prior"
    rationale: "Upstream exploration producers benefit from elevated realized crude barrel selling prices, offsetting potential marketing margin compressions at retail fuel pumps."
    evidence_refs:
      - "ONGC Quarterly Realization Disclosures"

  - source: "macro_brent_crude"
    target: "equity_asianpaints"
    sign: "negative"
    weight: 0.85
    lag_days: 10
    confidence: "high"
    provenance: "curated_prior"
    rationale: "Direct cost shock: raw material price sensitivity to crude monomers compresses Asian Paints operating margin profile."
    evidence_refs:
      - "Asian Paints Investor Presentation FY24"

  - source: "macro_brent_crude"
    target: "equity_indigo"
    sign: "negative"
    weight: 0.90
    lag_days: 5
    confidence: "high"
    provenance: "curated_prior"
    rationale: "Direct cost shock: ATF jet fuel repricing directly inflates IndiGo CASM (cost per available seat kilometer)."
    evidence_refs:
      - "IndiGo FY24 Earnings Conference Call Transcripts"

  - source: "macro_brent_crude"
    target: "equity_ongc"
    sign: "positive"
    weight: 0.80
    lag_days: 2
    confidence: "high"
    provenance: "curated_prior"
    rationale: "Upstream producer ONGC earns revenues benchmarked to gross Brent realization per barrel (net of statutory windfall levies)."
    evidence_refs:
      - "ONGC Annual Financial Disclosures FY24"

  - source: "macro_brent_crude"
    target: "equity_reliance"
    sign: "ambiguous"
    weight: 0.50
    lag_days: 5
    confidence: "medium"
    provenance: "curated_prior"
    rationale: "Contested channel: High crude lifts gross refining margins (GRMs) on diesel and jet fuel exports, but simultaneously inflates naphtha and downstream petrochemical feedstock costs."
    evidence_refs:
      - "Reliance Industries Annual Report (Oil-to-Chemicals Segment Performance)"

  - source: "macro_brent_crude"
    target: "equity_bpcl"
    sign: "negative"
    weight: 0.75
    lag_days: 5
